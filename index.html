<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кулинарная библиотека</title>
  <meta name="description" content="Автономная кулинарная библиотека проверенных домашних и ресторанных рецептов">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="3b336dd0-5827-4ef1-99ff-2b037697afd8"></script>
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand">
        <span class="brand-logo">📖</span>
        <div class="brand-text">
          <h1>Кулинарная библиотека Елены</h1>
        </div>
      </a>
    </div>
  </header>

  <main class="container">
    <!-- Поиск и фильтры -->
    <section class="search-filter-section">
      <div class="search-bar-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="recipeSearchInput" 
          class="search-input" 
          placeholder="Поиск по названию или ингредиентам (например: орехи какао, сгущенка, белки)..."
          autocomplete="off"
        >
        <button id="searchClearBtn" class="search-clear" title="Очистить поиск">✕</button>
      </div>

      <div class="filter-row">
        <div class="category-chips">
          <button class="chip active" data-category="all">Все</button>
          <button class="chip" data-category="Торты и десерты">Торты и десерты</button>
          <button class="chip" data-category="Напитки">Напитки</button>
          <button class="chip" data-category="Конфеты и сладости">Конфеты и сладости</button>
          <button class="chip" data-category="Выпечка">Выпечка</button>
          <button class="chip" data-category="Основные блюда">Основные блюда</button>
        </div>

        <div class="sort-select-wrapper">
          <select id="sortSelect" class="sort-select">
            <option value="default">По умолчанию</option>
            <option value="name-asc">По названию (А–Я)</option>
            <option value="name-desc">По названию (Я–А)</option>
            <option value="time-asc">По времени (быстрее)</option>
            <option value="difficulty-asc">По сложности: простые</option>
            <option value="difficulty-desc">По сложности: сложные</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Сетка рецептов -->
    <section id="recipesGrid" class="recipes-grid">
      <!-- Карточки наполняются динамически через search.js -->
    </section>

    <!-- Заглушка при отсутствии совпадений -->
    <div id="emptyState" class="empty-state">
      <div class="empty-state-icon">🥣</div>
      <h3>Ничего не нашлось</h3>
      <p class="text-muted">Попробуйте изменить формулировку запроса или очистить фильтр ингредиентов.</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>© Кулинарная библиотека Елены.</p>
  </footer>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/search.js"></script>
</body>
</html>
